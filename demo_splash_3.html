<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

	<title>Leaflet Splash 3</title>
	<link rel="icon" type="image/png" href="./img/leaflet.png">

	<meta name="description" content="Demonstrate Leaflet Splash Screen">
	<meta name="keywords" content="Egypt, GIS, Web mapping">
	<meta name="author" content="Essam A. El-Sherif">

	<link rel="stylesheet" type="text/css" href="css/esm-ribbon.css">
	<link rel="stylesheet" type="text/css" href="https://unpkg.com/leaflet@1.7.1/dist/leaflet.css" />

	<style>
		html { width: 100%;	height: 100%; }
		body{ height: 100%; margin:0; padding:0; background-color: rgb(226, 177, 56);}

		#welcome{
			position: absolute;
			top: 0; left: 0;
			margin: 0; padding: 0;
			width: 100%; height: 100%;
		}

		#welcome-1{ top: 0; left: 0; }
		#welcome-2{ top: 0; right: 0; }
		#welcome-3{ bottom: 0; left: 0; }
		#welcome-4{ bottom: 0; right: 0; }
		#welcome-1, #welcome-2, #welcome-3, #welcome-4{
			position: absolute;
			width: 50%; height: 50%;
			background-image: url('./img/splash/splash_3_background.jpg');
			background-position: center center;
			background-size: contain;
			background-repeat: no-repeat;			
			transition: 0.7s;
		} 

		#welcome-content{
			position: absolute;
			top:30%; left:0;
			width: 100%;
			height: 40%;
			margin:auto;

			color: #FFEFD5;
			font-family: sans-serif;
			font-weight: bold;
			font-size: 30px;
			text-align: center;
			text-decoration: none;
			text-shadow: -3px -3px 5px black, 4px 4px 8px black;
			text-shadow: 0 2px 5px black;
			cursor: pointer;
		}
		
		#mapid{
			position: relative;
			width: 100%; height: 100%;
			top: 0; left: 0;
			margin:0; padding:0;
			border: none;
			box-shadow: none;
		}

		/* Extra small devices (phones, 600px and down) */
		@media only screen and (max-width: 600px) { 
			#welcome-content{ font-size: 18px; }
		} 
		/* Small devices (portrait tablets and large phones, 600px and up) */
		@media only screen and (min-width: 600px) {  
			#welcome-content{ font-size: 20px; }
		} 
		/* Medium devices (landscape tablets, 768px and up) */
		@media only screen and (min-width: 768px) {  
			#welcome-content{ font-size: 26px; }
		} 
		/* Large devices (laptops/desktops, 992px and up) */
		@media only screen and (min-width: 992px) {  
			#welcome-content{ font-size: 28px; }
		} 
		/* Extra large devices (large laptops and desktops, 1200px and up) */
		@media only screen and (min-width: 1200px) { 
			#welcome-content{ font-size: 30px; }
		}
		
	</style>

	<script src="https://unpkg.com/leaflet@1.7.1/dist/leaflet.js"></script>
	<script src="js/basemap.js"></script>
	<script src="js/demo_splash_3.js"></script>
</head>
<body>
	<div id="mapid">
		<a
			class="esm-ribbon left-top" target="_blank" title="Essam A. El-Sherif"
			href="https://essamatefelsherif.github.io/whoami"
			data-ribbon="Essam A. El-Sherif">
		</a>
	</div>
	<div id="welcome">
		<div id="welcome-1"></div>
		<div id="welcome-2"></div>
		<div id="welcome-3"></div>
		<div id="welcome-4"></div>
		<div id="welcome-content">
			EGYPT<br>
			welcome to exploring the map<br>
			click to proceed
		</div>
	</div>
</body>
</html>
