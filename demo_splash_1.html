<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

	<title>Leaflet Splash 1</title>

	<link rel="icon" type="image/png" href="./img/leaflet.png">

	<meta name="description" content="Demonstrate Leaflet Splash Screen">
	<meta name="author" content="Essam A. El-Sherif">

	<!-- Open Graph / Facebook -->
	<meta property="og:type" content="website">
	<meta property="og:url" content="https://essamatefelsherif.github.io/Leaflet.Splash/demo_splash_1.html">
	<meta property="og:title" content="Leaflet Splash 1">
	<meta property="og:description" content="Demonstrate Leaflet Splash Screen">
	<meta property="og:image" content="https://essamatefelsherif.github.io/Leaflet.Splash/img/travel-guide_02.jpg">

	<link rel="stylesheet" type="text/css" href="css/esm-ribbon.css">
	<link rel="stylesheet" type="text/css" href="https://unpkg.com/leaflet@1.7.1/dist/leaflet.css">

	<style>
		html { width: 100%;	height: 100%; }
		body{ height: 100%; margin:0; padding:0; }

		#frame{ width: 100%; height: 100%; margin:0; padding:0; }

		#mapid{
			position: relative;
			width: 100%; height: 100%;
			top: 0; left: 0;
			margin:0; padding:0;
			border: none;
			box-shadow: none;
			transition: 1.0s;
		}

		body.background{
			background-position: center;
			background-repeat: no-repeat;
			background-size: cover;
			background-image: url('./img/splash/splash_1_background.jpg');
		}

		#frame.background{
			background-position: center;
			background-repeat: no-repeat;
			background-size: 100% 100%;
			background-image: url('./img/splash/splash_1_frame.png');
			background-color: transparent;
		}

		#mapid.background{
			top: 15%; left: 12%;
			width: 76%;	height: 70%;
			border: 1px solid rgb(115, 65, 22);
			box-shadow: 8px 0px 14px rgb(79, 44, 15), -12px 0px 14px rgb(79, 44, 15);
		}

		.egy-banner{
			background-color:transparent;
			border-color:transparent;
			box-shadow: none;
			font-weight: bold;
			text-align:center;
			font-family: sans-serif;
			font-size: 24px;
			letter-spacing: 2px;
			color: rgb(213, 168, 102);
			text-shadow: 0px 2px 2px #000;
		}

		.egy-banner:hover{
			text-shadow: 1px 3px 3px #000;
		}

		.egy-banner .small{font-size: 80%; font-weight: normal;}
		.egy-banner .vsmall{font-size: 60%; font-weight: normal;}

		.leaflet-control-scale-line {
			border: 2px solid #999;
			border-top: none;
			border-left:1px solid #999;
			line-height: 1.1;
			padding: 2px 5px 1px;
			font-size: 12px;
			white-space: nowrap;
			overflow: hidden;
			-moz-box-sizing: border-box;
			     box-sizing: border-box;
			background: #fff;
			background: rgba(255, 255, 255, 0.5);
			box-shadow: 2px 2px 2px grey;
			text-align: center;
		}

		/* Extra small devices (phones, 600px and down) */
		@media only screen and (max-width: 600px) { 
			.egy-banner{ font-size: 14px; }
		} 
		/* Small devices (portrait tablets and large phones, 600px and up) */
		@media only screen and (min-width: 600px) {  
			.egy-banner{ font-size: 16px; }
		} 
		/* Medium devices (landscape tablets, 768px and up) */
		@media only screen and (min-width: 768px) {  
			.egy-banner{ font-size: 18px; }
		} 
		/* Large devices (laptops/desktops, 992px and up) */
		@media only screen and (min-width: 992px) {  
			.egy-banner{ font-size: 21px; }
		} 
		/* Extra large devices (large laptops and desktops, 1200px and up) */
		@media only screen and (min-width: 1200px) { 
			.egy-banner{ font-size: 24px; }
		}
	</style>

	<script src="https://unpkg.com/leaflet@1.7.1/dist/leaflet.js"></script>
	<script src="js/basemap.js"></script>
	<script src="js/demo_splash_1.js"></script>
</head>
<body class="background">
	<div class="background" id="frame">
		<div class="background" id="mapid">
			<a
				class="esm-ribbon left-top" target="_blank" title="Essam A. El-Sherif"
				href="https://essamatefelsherif.github.io/whoami"
				data-ribbon="Essam A. El-Sherif">
			</a>
		</div>
	</div>
</body>
</html>
