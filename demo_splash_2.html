<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

	<title>Leaflet Splash 2</title>

	<link rel="icon" type="image/png" href="./img/leaflet.png">

	<meta name="description" content="Demonstrate Leaflet Splash Screen">
	<meta name="author" content="Essam A. El-Sherif">

	<!-- Open Graph / Facebook -->
	<meta property="og:type" content="website">
	<meta property="og:url" content="https://essamatefelsherif.github.io/Leaflet.Splash/demo_splash_2.html">
	<meta property="og:title" content="Leaflet Splash 2">
	<meta property="og:description" content="Demonstrate Leaflet Splash Screen">
	<meta property="og:image" content="https://essamatefelsherif.github.io/Leaflet.Splash/img/travel-guide_02.jpg">

	<link rel="stylesheet" type="text/css" href="css/esm-ribbon.css">
	<link rel="stylesheet" type="text/css" href="https://unpkg.com/leaflet@1.7.1/dist/leaflet.css">

	<style>
		html { width: 100%;	height: 100%; }
		body{ height: 100%; margin:0; padding:0; background-color: rgb(217, 153, 85);}

		#splash-container{
			position: absolute;
			top: 0; left: 0;
			margin: 0; padding: 0;
			width: 100%; height: 100%;
		}

		#splash-img-1{ top: 0; left: 0; }
		#splash-img-2{ top: 0; right: 0; }

		#splash-img-1, #splash-img-2{
			position: absolute;
			width: 50%; height: 100%;
			background-image: url('./img/splash/splash_2_background.jpg');
			background-position: center center;
			background-size: cover;
			background-repeat: no-repeat;			
			transition: 0.7s;
		} 

		#splash-text{
			position: absolute;
			top:30%; left:0;
			width: 100%;
			height: 40%;
			margin:auto;

			color: #FFEFD5;
			font-family: sans-serif;
			font-weight: bold;
			font-size: 30px;
			text-align: center;
			text-decoration: none;
			text-shadow: -3px -3px 5px black, 4px 4px 8px black;
			text-shadow: 0 2px 5px black;
			cursor: pointer;
		}
		
		#mapid{
			position: relative;
			width: 100%; height: 100%;
			top: 0; left: 0;
			margin:0; padding:0;
			border: none;
			box-shadow: none;
		}

		/* Extra small devices (phones, 600px and down) */
		@media only screen and (max-width: 600px) { 
			#splash-text{ font-size: 18px; }
		} 
		/* Small devices (portrait tablets and large phones, 600px and up) */
		@media only screen and (min-width: 600px) {  
			#splash-text{ font-size: 20px; }
		} 
		/* Medium devices (landscape tablets, 768px and up) */
		@media only screen and (min-width: 768px) {  
			#splash-text{ font-size: 26px; }
		} 
		/* Large devices (laptops/desktops, 992px and up) */
		@media only screen and (min-width: 992px) {  
			#splash-text{ font-size: 28px; }
		} 
		/* Extra large devices (large laptops and desktops, 1200px and up) */
		@media only screen and (min-width: 1200px) { 
			#splash-text{ font-size: 30px; }
		}
	</style>

	<script src="https://unpkg.com/leaflet@1.7.1/dist/leaflet.js"></script>
	<script src="js/basemap.js"></script>
	<script src="js/demo_splash_2.js"></script>
</head>
<body>
	<div id="mapid">
		<a
			class="esm-ribbon left-top" target="_blank" title="Essam A. El-Sherif"
			href="https://essamatefelsherif.github.io/whoami"
			data-ribbon="Essam A. El-Sherif">
		</a>
	</div>
	<div id="splash-container">
		<div id="splash-img-1"></div>
		<div id="splash-img-2"></div>
		<div id="splash-text">
			EGYPT<br/>
			welcome to exploring the map<br/>
			click to proceed
		</div>
	</div>
</body>
</html>
